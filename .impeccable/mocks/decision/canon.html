<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>แจ้ง: แบบมาตรฐาน</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#EEF0EC;font-family:Anuphan,system-ui,sans-serif;color:#1F1F1F}
.top{position:absolute;top:52px;left:16px;right:16px;height:50px;border-radius:25px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;padding:0 8px 0 18px}
.top b{color:#1A73E8;font-size:19px}.top span{flex:1;color:#70757A;font-size:15px}
.av{width:34px;height:34px;border-radius:50%;background:#1A73E8;color:#fff;display:grid;place-items:center;font-size:12px}
.chips{position:absolute;top:112px;left:16px;display:flex;gap:8px}
.chips span{height:34px;padding:0 14px;border-radius:17px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);display:flex;align-items:center;gap:6px;font-size:13px}
.chips i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.loc{position:absolute;right:16px;bottom:262px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;place-items:center;color:#1A73E8;font-size:20px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:240px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);padding:12px 20px}
.grab{width:36px;height:4px;border-radius:2px;background:#DADCE0;margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:600}.sheet p{font-size:14px;color:#5F6368;margin-top:4px}
.item{display:flex;gap:12px;align-items:center;margin-top:16px}
.item i{width:40px;height:40px;border-radius:12px;background:var(--c);opacity:.85}
.item b{font-size:15px;font-weight:500;display:block}.item span{font-size:13px;color:#5F6368}
.fab{position:absolute;right:16px;bottom:196px;height:52px;padding:0 20px;border-radius:16px;background:#1A73E8;color:#fff;font-size:16px;font-weight:500;display:flex;align-items:center;box-shadow:0 4px 12px rgba(26,115,232,.4)}
</style></head><body>

 <path d="M-20 320 C 90 350 160 300 240 350 S 360 430 420 410" stroke-width="14"/>

<span class="pin" style="--c:#D93025;left:212px;top:300px"></span><span class="pin" style="--c:#F29900;left:96px;top:400px"></span><span class="pin" style="--c:#F9AB00;left:300px;top:470px"></span>
<div class="top"><b>แจ้ง</b><span>ค้นหาเรื่องหรือสถานที่</span><span class="av">ฉัน</span></div>

<div class="item" style="--c:#D93025"><i></i><div><b>ไฟถนนดับทั้งซอย</b><span>วิกฤต · 18 คนเจอเหมือนกัน · 12 วัน</span></div></div>
