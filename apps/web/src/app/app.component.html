<ion-app>
  <ion-router-outlet [animation]="glassNav"></ion-router-outlet>
</ion-app>

<!-- once per visit: a point of light becomes a beam, writes the name and falls into the map -->
<app-intro />

<!-- the installed app found a newer build: reloading is the reader's call -->
@if (update.ready()) {
  <div class="update" role="status">
    <span>{{ 'update.ready' | t }}</span>
    <button type="button" (click)="update.reload()">{{ 'update.reload' | t }}</button>
  </div>
}
