<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <title>แจ้ง</title>

  <base href="/" />

  <meta name="theme-color" content="#FBF7F2" />
  <!-- the stored theme and language, applied before the first paint so nothing flashes -->
  <script data-boot>
    try {
      var t = localStorage.getItem('jaeng.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m && t === 'dark') m.setAttribute('content', '#23212B');
      var l = localStorage.getItem('jaeng.locale');
      if (l === 'th' || l === 'en') document.documentElement.lang = l;
    } catch (e) {}
  </script>

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
