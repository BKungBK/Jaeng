<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Controller</title>
<style>
  :root {
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f8f9fc; --fg:#171c2b; --muted:#667085;
    --line:#e6e9f2; --accent:#2f6df6; --accent-soft:#e8efff; --ok:#12a150; --ok-soft:#e3f6ea;
    --warn:#c77700; --warn-soft:#fff3dc; --bad:#d92d3a; --bad-soft:#fde8ea; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
    --radius:14px; --sidebar:232px;
    --font: "Segoe UI","Leelawadee UI","Noto Sans Thai",system-ui,-apple-system,sans-serif;
    --mono: ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1017; --surface:#151a24; --surface2:#1a2030; --fg:#e8ecf5; --muted:#8a94a8;
      --line:#262d3c; --accent:#5b8cff; --accent-soft:#1c2a4d; --ok:#35c46f; --ok-soft:#14301f;
      --warn:#f0a43a; --warn-soft:#34260f; --bad:#ff6470; --bad-soft:#38161a; --shadow:none;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1017; --surface:#151a24; --surface2:#1a2030; --fg:#e8ecf5; --muted:#8a94a8;
    --line:#262d3c; --accent:#5b8cff; --accent-soft:#1c2a4d; --ok:#35c46f; --ok-soft:#14301f;
    --warn:#f0a43a; --warn-soft:#34260f; --bad:#ff6470; --bad-soft:#38161a; --shadow:none;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* layout */
  .app { display:grid; grid-template-columns:var(--sidebar) 1fr; min-height:100vh; }
  aside { position:sticky; top:0; height:100vh; padding:20px 14px; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 10px 18px; font-weight:700; font-size:16px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#2f6df6,#6aa2ff); display:grid; place-items:center; color:#fff; }
  nav { display:flex; flex-direction:column; gap:4px; }
  nav button { display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border:0; border-radius:10px; background:none; color:var(--muted); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
  nav button:hover { background:var(--surface2); color:var(--fg); }
  nav button.active { background:var(--accent-soft); color:var(--accent); }
  nav .count { margin-left:auto; font-size:12px; font-weight:600; background:var(--surface2); border:1px solid var(--line); border-radius:99px; padding:0 8px; color:var(--muted); }
  nav button.active .count { background:transparent; border-color:transparent; color:var(--accent); }
  .side-foot { margin-top:auto; display:flex; flex-direction:column; gap:10px; padding:10px; font-size:12px; color:var(--muted); }
  .conn { display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.ok { background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
  .dot.bad { background:var(--bad); box-shadow:0 0 0 3px var(--bad-soft); }
  main { padding:28px 32px 60px; max-width:1240px; width:100%; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { margin:0; font-size:24px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin-top:2px; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* controls */
  button.btn { display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--fg); font:inherit; font-weight:600; cursor:pointer; transition:.12s; }
  button.btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.btn.primary:hover:not(:disabled) { filter:brightness(1.08); color:#fff; }
  button.btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  button.btn.danger:hover:not(:disabled) { filter:brightness(1.08); color:#fff; }
  button.btn.ghost-danger:hover:not(:disabled) { border-color:var(--bad); color:var(--bad); }
  button.btn.sm { padding:4px 9px; font-size:12.5px; border-radius:8px; }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], select { font:inherit; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--fg); min-width:0; }
  input[type=text]:focus, select:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .search { width:240px; }
  label.chk { display:inline-flex; align-items:center; gap:7px; color:var(--muted); cursor:pointer; user-select:none; }

  /* cards */
  .grid { display:grid; gap:16px; }
  .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .stat .label { color:var(--muted); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .stat .value { font-size:28px; font-weight:700; letter-spacing:-.02em; margin-top:4px; }
  .stat .value small { font-size:14px; font-weight:600; color:var(--muted); }
  .bar { height:10px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; position:relative; }
  .bar > i { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:99px; }
  .bar > i.rec { background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 5px,transparent 5px,transparent 9px); opacity:.85; }
  .bar.warn > i:first-child { background:var(--warn); } .bar.bad > i:first-child { background:var(--bad); }
  .rowline { display:flex; justify-content:space-between; gap:12px; align-items:baseline; margin:12px 0 6px; }
  .muted { color:var(--muted); } .mono { font-family:var(--mono); font-size:12.5px; }
  .breakdown .item + .item { margin-top:16px; }

  /* tables */
  .tablecard { padding:0; overflow:hidden; }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:760px; }
  th { text-align:left; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; padding:12px 16px; background:var(--surface2); border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:12px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:var(--surface2); }
  td .name { font-weight:600; }
  td .tiny { color:var(--muted); font-size:12px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .empty { text-align:center; color:var(--muted); padding:44px 16px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:99px; font-size:12.5px; font-weight:700; background:var(--surface2); color:var(--muted); }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.running,.pill.ok { color:var(--ok); background:var(--ok-soft); }
  .pill.exited,.pill.dead,.pill.bad { color:var(--bad); background:var(--bad-soft); }
  .pill.paused,.pill.restarting,.pill.created,.pill.warn { color:var(--warn); background:var(--warn-soft); }
  .tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:11.5px; font-weight:700; background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:1px; }
  .tag.warn { background:var(--warn-soft); color:var(--warn); }

  /* cleanup */
  .hero { display:flex; gap:20px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:linear-gradient(135deg,var(--accent-soft),var(--surface)); }
  .hero .big { font-size:34px; font-weight:800; letter-spacing:-.02em; }
  .cleancard { display:flex; flex-direction:column; gap:10px; }
  .cleancard .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .cleancard .est { font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .cleancard p { margin:0; color:var(--muted); font-size:13px; flex:1; }
  .cleancard.risky { border-color:color-mix(in srgb,var(--bad) 40%,var(--line)); }
  .notice { display:flex; gap:12px; padding:14px 16px; border-radius:12px; background:var(--warn-soft); color:var(--fg); border:1px solid color-mix(in srgb,var(--warn) 35%,transparent); }
  .notice code, .cmd { font-family:var(--mono); font-size:12.5px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
  pre.cmdblock { margin:8px 0 0; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; font:12.5px/1.5 var(--mono); overflow:auto; }

  /* dialogs, toasts, misc */
  dialog { width:min(560px,94vw); max-height:88vh; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--fg); padding:0; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  dialog.wide { width:min(920px,95vw); }
  dialog::backdrop { background:rgba(8,12,22,.55); backdrop-filter:blur(2px); }
  .dh { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); }
  .dh h2 { margin:0; font-size:17px; }
  .db { padding:18px 20px; overflow:auto; max-height:60vh; }
  .df { display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--line); background:var(--surface2); border-radius:0 0 16px 16px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label { font-weight:600; font-size:13px; }
  .field input { width:100%; }
  .field .hint { font-size:12px; color:var(--muted); }
  .list { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:12px; }
  .list .li { display:flex; justify-content:space-between; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .list .li:last-child { border-bottom:0; }
  pre.logs { margin:0; padding:14px 18px; max-height:62vh; overflow:auto; background:var(--bg); font:12px/1.5 var(--mono); white-space:pre-wrap; word-break:break-all; }
  #toasts { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:100; }
  .toast { padding:12px 16px; border-radius:12px; background:var(--fg); color:var(--bg); box-shadow:0 10px 30px rgba(0,0,0,.25); max-width:380px; font-weight:600; animation:in .18s ease; }
  .toast.bad { background:var(--bad); color:#fff; } .toast.ok { background:var(--ok); color:#fff; }
  @keyframes in { from { transform:translateY(8px); opacity:0; } }
  #busy { position:fixed; left:0; top:0; height:3px; width:0; background:var(--accent); z-index:200; transition:width .3s; }
  #busy.on { width:70%; transition:width 6s cubic-bezier(.1,.8,.2,1); }
  .spin { width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .banner { display:none; margin-bottom:16px; padding:12px 16px; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-weight:600; }

  @media (max-width: 980px) { .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width: 820px) {
    .app { grid-template-columns:1fr; }
    aside { position:static; height:auto; flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); }
    .brand { padding:0 8px 0 0; } .brand span { display:none; }
    nav { flex-direction:row; } nav button { white-space:nowrap; padding:8px 12px; }
    nav button .count { display:none; }
    .side-foot { display:none; }
    main { padding:18px 14px 50px; }
    .g2 { grid-template-columns:1fr; }
    .search { width:100%; }
  }
  @media (max-width: 520px) { .g4 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="busy"></div>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div><span>Docker Controller</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="conn"><span id="conn" class="dot"></span><span id="connText">กำลังเชื่อมต่อ…</span></div>
      <button class="btn sm" id="theme" type="button">ธีม: อัตโนมัติ</button>
    </div>
  </aside>
  <main>
    <div class="banner" id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<dialog id="logDlg" class="wide">
  <div class="dh"><h2 id="logTitle">Logs</h2>
    <div class="toolbar">
      <select id="logTail"><option value="100">100 บรรทัด</option><option value="300" selected>300 บรรทัด</option><option value="1000">1000 บรรทัด</option></select>
      <button class="btn sm" id="logReload" type="button">โหลดใหม่</button>
      <button class="btn sm" id="logClose" type="button">ปิด</button>
    </div>
  </div>
  <pre class="logs" id="logBody"></pre>
</dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const ICONS = {
  overview:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  containers:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  images:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  volumes:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  networks:'<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12M12 12l-6 5M12 12l6 5"/>',
  cleanup:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/>',
  refresh:'<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24">${ICONS[n] || ""}</svg>`;

/* ---------- helpers ---------- */
const UNITS = { B:1, KB:1e3, MB:1e6, GB:1e9, TB:1e12, KIB:1024, MIB:1024**2, GIB:1024**3, TIB:1024**4 };
function parseSize(s) {
  const m = /([\d.]+)\s*([kKMGT]?i?B)/.exec(String(s || ""));
  return m ? parseFloat(m[1]) * (UNITS[m[2].toUpperCase()] || 1) : 0;
}
function fmtBytes(n) {
  if (!n) return "0 B";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(n >= 10 ? 1 : 2)) + " " + u[i];
}
const pct = (s) => { const m = /\((\d+)%\)/.exec(s || ""); return m ? +m[1] : 0; };

async function api(path, opts = {}) {
  const o = { method: opts.method || "GET", headers: {} };
  if (o.method !== "GET") {
    o.headers["X-Requested-With"] = "docker-webui";
    if (opts.body !== undefined) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(opts.body); }
  }
  pending++; $("#busy").classList.add("on");
  try {
    const res = await fetch(path, o);
    let data = null; try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
    return data;
  } finally {
    if (--pending === 0) { const b = $("#busy"); b.classList.remove("on"); }
  }
}
let pending = 0;

function toast(msg, kind = "") {
  const t = document.createElement("div");
  t.className = "toast " + kind; t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), kind === "bad" ? 7000 : 4000);
}
function banner(msg) { const b = $("#banner"); b.textContent = msg || ""; b.style.display = msg ? "block" : "none"; }

/* ---------- dialogs ---------- */
function openDialog({ title, body, confirmText = "ตกลง", cancelText = "ยกเลิก", danger = false, needType = "", onConfirm, noCancel = false }) {
  const dlg = $("#dlg"), form = $("#dlgForm");
  form.innerHTML = `
    <div class="dh"><h2>${esc(title)}</h2></div>
    <div class="db">${body}
      ${needType ? `<div class="field" style="margin-top:14px"><label>พิมพ์ <b>${esc(needType)}</b> เพื่อยืนยัน</label><input type="text" id="needType" autocomplete="off"></div>` : ""}
    </div>
    <div class="df">
      ${noCancel ? "" : `<button class="btn" type="button" id="dlgCancel">${esc(cancelText)}</button>`}
      <button class="btn ${danger ? "danger" : "primary"}" type="submit" id="dlgOk">${esc(confirmText)}</button>
    </div>`;
  const ok = $("#dlgOk", form);
  if (needType) { ok.disabled = true; $("#needType", form).addEventListener("input", (e) => { ok.disabled = e.target.value.trim() !== needType; }); }
  const cancel = $("#dlgCancel", form); if (cancel) cancel.onclick = () => dlg.close();
  form.onsubmit = async (e) => {
    e.preventDefault();
    ok.disabled = true; ok.innerHTML = '<span class="spin"></span> กำลังทำงาน…';
    try { await onConfirm(form); dlg.close(); }
    catch (err) { toast(err.message, "bad"); ok.disabled = false; ok.textContent = confirmText; }
  };
  dlg.showModal();
  const first = $("input[type=text]", form); if (first) first.focus();
}

/* ---------- state & routing ---------- */
const TABS = [
  ["overview","ภาพรวม"], ["containers","คอนเทนเนอร์"], ["images","อิมเมจ"],
  ["volumes","วอลุ่ม"], ["networks","เครือข่าย"], ["cleanup","ล้างพื้นที่"],
];
const state = { tab: "overview", search: "", all: true, counts: {}, cleanup: null, lastReclaim: "" };

function renderNav() {
  $("#nav").innerHTML = TABS.map(([id, label]) =>
    `<button type="button" data-tab="${id}" class="${state.tab === id ? "active" : ""}">${icon(id)}<span>${label}</span>${state.counts[id] != null ? `<span class="count">${state.counts[id]}</span>` : ""}</button>`
  ).join("");
}
$("#nav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab);
});
function go(tab) {
  state.tab = tab; state.search = ""; location.hash = tab;
  renderNav(); mount(); refresh();
}
const view = $("#view");

function head(title, sub, actions = "") {
  return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="toolbar">${actions}</div></div>`;
}
const refreshBtn = `<button class="btn" type="button" data-do="refresh">${icon("refresh")}รีเฟรช</button>`;
const searchBox = (ph) => `<input class="search" type="text" id="search" placeholder="${ph}" value="${esc(state.search)}">`;

function mount() {
  if (state.tab === "containers") {
    view.innerHTML = head("คอนเทนเนอร์", "จัดการและดูสถานะคอนเทนเนอร์ทั้งหมด",
      `${searchBox("ค้นหาชื่อ / อิมเมจ…")}<label class="chk"><input type="checkbox" id="showAll" ${state.all ? "checked" : ""}> แสดงที่หยุดแล้ว</label>
       <button class="btn primary" type="button" data-do="run">${icon("plus")}รันคอนเทนเนอร์</button>${refreshBtn}`) +
      `<div class="card tablecard"><div class="tw"><table><thead><tr><th>ชื่อ</th><th>สถานะ</th><th>CPU</th><th>หน่วยความจำ</th><th>พอร์ต</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;
  } else if (state.tab === "images") {
    view.innerHTML = head("อิมเมจ", "อิมเมจที่ดาวน์โหลดไว้และพื้นที่ที่ใช้",
      `${searchBox("ค้นหาอิมเมจ…")}<button class="btn primary" type="button" data-do="pull">${icon("download")}ดึงอิมเมจ</button>${refreshBtn}`) +
      `<div class="card tablecard"><div class="tw"><table><thead><tr><th>อิมเมจ</th><th>ID</th><th>ขนาด</th><th>สร้างเมื่อ</th><th>ใช้งานโดย</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;
  } else if (state.tab === "volumes") {
    view.innerHTML = head("วอลุ่ม", "ข้อมูลถาวรของคอนเทนเนอร์ — ลบแล้วกู้คืนไม่ได้", `${searchBox("ค้นหาวอลุ่ม…")}${refreshBtn}`) +
      `<div class="card tablecard"><div class="tw"><table><thead><tr><th>ชื่อ</th><th>ขนาด</th><th>สถานะ</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;
  } else if (state.tab === "networks") {
    view.innerHTML = head("เครือข่าย", "เครือข่ายของ Docker", refreshBtn) +
      `<div class="card tablecard"><div class="tw"><table><thead><tr><th>ชื่อ</th><th>Driver</th><th>Scope</th><th>ID</th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;
  } else {
    view.innerHTML = '<div id="content"></div>';
  }
}

/* ---------- loaders ---------- */
let loading = false;
async function refresh() {
  if (loading) return; loading = true;
  const tab = state.tab;
  try {
    const ov = await api("/api/overview");
    setConn(true, `Docker ${ov.version}`); banner("");
    state.counts.containers = ov.containers.total;
    if (tab !== state.tab) return;
    if (tab === "overview") renderOverview(ov);
    else if (tab === "containers") await loadContainers();
    else if (tab === "images") await loadImages();
    else if (tab === "volumes") await loadVolumes();
    else if (tab === "networks") await loadNetworks();
    else if (tab === "cleanup") await loadCleanup(ov);
    renderNav();
  } catch (e) {
    setConn(false, "เชื่อมต่อ Docker ไม่ได้"); banner(e.message);
  } finally { loading = false; }
}
function setConn(ok, text) { $("#conn").className = "dot " + (ok ? "ok" : "bad"); $("#connText").textContent = text; }

const rowsOrEmpty = (rows, cols, msg) => rows || `<tr><td colspan="${cols}" class="empty">${msg}</td></tr>`;
const matches = (...f) => !state.search || f.join(" ").toLowerCase().includes(state.search.toLowerCase());

/* overview */
function dfRow(label, row) {
  const size = parseSize(row.Size), rec = parseSize((row.Reclaimable || "").split(" ")[0]);
  return { label, size, rec, total: row.TotalCount, active: row.Active, sizeText: row.Size, recText: (row.Reclaimable || "0B").split(" ")[0] };
}
function renderOverview(ov) {
  const names = { "Images":"อิมเมจ", "Containers":"คอนเทนเนอร์", "Local Volumes":"วอลุ่ม", "Build Cache":"Build cache" };
  const rows = ov.df.map((r) => dfRow(names[r.Type] || r.Type, r));
  const max = Math.max(1, ...rows.map((r) => r.size));
  const dockerTotal = rows.reduce((a, r) => a + r.size, 0), recTotal = rows.reduce((a, r) => a + r.rec, 0);
  const d = ov.disk, usedPct = Math.round((d.used / d.total) * 100);
  state.counts.images = (ov.df.find((r) => r.Type === "Images") || {}).TotalCount;
  state.counts.volumes = (ov.df.find((r) => r.Type === "Local Volumes") || {}).TotalCount;
  renderNav();
  view.innerHTML = head("ภาพรวม", "สถานะ Docker และการใช้พื้นที่", refreshBtn) + `
    <div class="grid g4">
      <div class="card stat"><div class="label">คอนเทนเนอร์ที่รัน</div><div class="value">${ov.containers.running} <small>/ ${ov.containers.total}</small></div></div>
      <div class="card stat"><div class="label">อิมเมจ</div><div class="value">${esc(state.counts.images ?? 0)}</div></div>
      <div class="card stat"><div class="label">Docker ใช้พื้นที่</div><div class="value">${fmtBytes(dockerTotal)}</div></div>
      <div class="card stat"><div class="label">ล้างได้ประมาณ</div><div class="value" style="color:var(--warn)">${fmtBytes(recTotal)}</div></div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card">
        <h3>ดิสก์ของ WSL</h3><div class="muted" style="margin-bottom:10px">ใช้ ${fmtBytes(d.used)} จาก ${fmtBytes(d.total)} (ดิสก์เสมือน — ไฟล์จริงบน Windows โตตามที่ใช้)</div>
        <div class="bar ${usedPct > 85 ? "bad" : usedPct > 65 ? "warn" : ""}"><i style="width:${Math.max(usedPct, 1)}%"></i></div>
        <div class="rowline"><span class="muted">เหลือ ${fmtBytes(d.free)}</span><b>${usedPct}%</b></div>
        <div class="rowline" style="margin-top:14px"><span class="muted">ต้องการคืนพื้นที่?</span><button class="btn primary sm" type="button" data-tab-go="cleanup">${icon("cleanup")}ไปหน้าล้างพื้นที่</button></div>
      </div>
      <div class="card breakdown">
        <h3>พื้นที่ที่ Docker ใช้</h3><div class="muted" style="margin-bottom:12px">แถบลายส้ม = ส่วนที่ล้างได้</div>
        ${rows.map((r) => `<div class="item">
          <div class="rowline" style="margin:0 0 6px"><span><b>${r.label}</b> <span class="muted">· ${r.total} รายการ, ใช้งาน ${r.active}</span></span><span><b>${esc(r.sizeText)}</b> ${r.rec ? `<span class="tag warn">ล้างได้ ${esc(r.recText)}</span>` : ""}</span></div>
          <div class="bar"><i style="width:${(r.size / max) * 100}%"></i><i class="rec" style="width:${(r.rec / max) * 100}%"></i></div>
        </div>`).join("")}
      </div>
    </div>`;
}

/* containers */
async function loadContainers() {
  const [rows, stats] = await Promise.all([
    api(`/api/containers?all=${state.all ? 1 : 0}`),
    api("/api/stats").catch(() => []),
  ]);
  const st = Object.fromEntries(stats.map((s) => [s.ID, s]));
  rows.sort((a, b) => (a.State === "running" ? 0 : 1) - (b.State === "running" ? 0 : 1) || a.Names.localeCompare(b.Names));
  const html = rows.filter((c) => matches(c.Names, c.Image)).map((c) => {
    const run = c.State === "running", s = st[c.ID.slice(0, 12)] || {}, id = esc(c.ID);
    return `<tr>
      <td><div class="name">${esc(c.Names)}</div><div class="tiny mono">${esc(c.Image)}</div></td>
      <td><span class="pill ${esc(c.State)}">${esc(c.State)}</span><div class="tiny">${esc(c.Status)}</div></td>
      <td>${run ? esc(s.CPUPerc || "—") : "—"}</td>
      <td>${run ? esc((s.MemUsage || "—").split(" / ")[0]) : "—"}</td>
      <td class="mono">${esc(c.Ports) || "—"}</td>
      <td><div class="acts">
        ${run ? `<button class="btn sm" data-act="stop" data-id="${id}">หยุด</button><button class="btn sm" data-act="restart" data-id="${id}">รีสตาร์ท</button>`
              : `<button class="btn sm" data-act="start" data-id="${id}">เริ่ม</button>`}
        ${c.State === "paused" ? `<button class="btn sm" data-act="unpause" data-id="${id}">ทำต่อ</button>` : run ? `<button class="btn sm" data-act="pause" data-id="${id}">พัก</button>` : ""}
        <button class="btn sm" data-logs="${id}" data-name="${esc(c.Names)}">ล็อก</button>
        <button class="btn sm ghost-danger" data-act="rm" data-id="${id}" data-name="${esc(c.Names)}">${icon("trash")}</button>
      </div></td></tr>`;
  }).join("");
  $("#tbody").innerHTML = rowsOrEmpty(html, 6, "ไม่มีคอนเทนเนอร์");
}

/* images */
const imgRef = (i) => (i.Repository && i.Repository !== "<none>" ? `${i.Repository}:${i.Tag}` : i.ID.replace("sha256:", ""));
async function loadImages() {
  const rows = await api("/api/images");
  state.counts.images = rows.length;
  rows.sort((a, b) => parseSize(b.Size) - parseSize(a.Size));
  const html = rows.filter((i) => matches(i.Repository, i.Tag, i.ID)).map((i) => {
    const used = +i.Containers > 0, dang = !i.Repository || i.Repository === "<none>";
    return `<tr>
      <td><div class="name">${esc(imgRef(i))}${dang ? '<span class="tag warn">dangling</span>' : ""}</div></td>
      <td class="mono">${esc(i.ID.replace("sha256:", "").slice(0, 12))}</td>
      <td><b>${esc(i.Size)}</b></td><td>${esc(i.CreatedSince)}</td>
      <td>${used ? `<span class="pill running">${i.Containers} คอนเทนเนอร์</span>` : '<span class="muted">ไม่ได้ใช้</span>'}</td>
      <td><div class="acts"><button class="btn sm ghost-danger" data-imgrm="${esc(imgRef(i))}" ${used ? "disabled title=\"มีคอนเทนเนอร์ใช้อยู่\"" : ""}>${icon("trash")}ลบ</button></div></td></tr>`;
  }).join("");
  $("#tbody").innerHTML = rowsOrEmpty(html, 6, "ไม่มีอิมเมจ");
}

/* volumes */
async function loadVolumes() {
  const rows = await api("/api/volumes");
  state.counts.volumes = rows.length;
  rows.sort((a, b) => parseSize(b.Size) - parseSize(a.Size));
  const html = rows.filter((v) => matches(v.Name)).map((v) => `<tr>
    <td><div class="name mono" style="word-break:break-all">${esc(v.Name.length > 40 ? v.Name.slice(0, 20) + "…" + v.Name.slice(-8) : v.Name)}</div>${v.Anonymous ? '<span class="tiny">anonymous</span>' : ""}</td>
    <td><b>${esc(v.Size || "—")}</b></td>
    <td>${v.Links > 0 ? `<span class="pill running">ใช้อยู่ ${v.Links}</span>` : '<span class="pill warn">ไม่ได้ใช้</span>'}</td>
    <td><div class="acts"><button class="btn sm ghost-danger" data-volrm="${esc(v.Name)}" ${v.Links > 0 ? "disabled title=\"มีคอนเทนเนอร์ใช้อยู่\"" : ""}>${icon("trash")}ลบ</button></div></td></tr>`).join("");
  $("#tbody").innerHTML = rowsOrEmpty(html, 4, "ไม่มีวอลุ่ม");
}

/* networks */
async function loadNetworks() {
  const rows = await api("/api/networks");
  $("#tbody").innerHTML = rowsOrEmpty(rows.map((n) => `<tr>
    <td><div class="name">${esc(n.Name)}${n.Builtin ? '<span class="tag">ระบบ</span>' : ""}</div></td>
    <td>${esc(n.Driver)}</td><td>${esc(n.Scope)}</td><td class="mono">${esc(n.ID)}</td></tr>`).join(""), 4, "ไม่มีเครือข่าย");
}

/* cleanup */
const CLEAN = [
  { kind:"containers", title:"คอนเทนเนอร์ที่หยุดแล้ว", desc:"ลบคอนเทนเนอร์ที่ไม่ได้รัน (exited / created) พร้อมข้อมูลชั่วคราวในตัวมัน วอลุ่มไม่ถูกแตะ", level:"safe" },
  { kind:"images", title:"อิมเมจ dangling", desc:"อิมเมจที่ไม่มีแท็กและไม่มีใครใช้ — ซากจากการ build ซ้ำ ปลอดภัยที่สุด", level:"safe" },
  { kind:"builder", title:"Build cache", desc:"แคชจากการ docker build ลบแล้วแค่ build ครั้งถัดไปช้าลง", level:"safe" },
  { kind:"images-all", title:"อิมเมจที่ไม่ได้ใช้ทั้งหมด", desc:"อิมเมจทุกตัวที่ไม่มีคอนเทนเนอร์ใช้ ต้องดึงใหม่ถ้าจะใช้อีก", level:"mid" },
  { kind:"volumes", title:"วอลุ่มที่ไม่ได้ใช้ (anonymous)", desc:"วอลุ่มชื่อสุ่มที่ไม่มีคอนเทนเนอร์ใช้ — ข้อมูลในนั้นหายถาวร", level:"risky" },
  { kind:"volumes-all", title:"วอลุ่มที่ไม่ได้ใช้ทั้งหมด", desc:"รวมวอลุ่มที่ตั้งชื่อเอง (เช่นฐานข้อมูล) ที่ตอนนี้ไม่มีคอนเทนเนอร์ผูกอยู่ — อันตรายที่สุด", level:"risky" },
];
const KIND_TH = { container:"คอนเทนเนอร์", image:"อิมเมจ", volume:"วอลุ่ม", cache:"cache" };
const sumSize = (items) => items.reduce((a, i) => a + parseSize(i.size), 0);

async function loadCleanup(ov) {
  const data = await api("/api/cleanup");
  state.cleanup = data;
  const rec = sumSize(data.system);
  const safeCount = data.system.length;
  const docker = ov ? ov.disk : null;
  $("#content").innerHTML = head("ล้างพื้นที่", "ดูรายการที่จะถูกลบก่อนยืนยันทุกครั้ง", refreshBtn) + `
    <div class="card hero">
      <div><div class="muted" style="font-weight:600">ล้างได้โดยไม่แตะวอลุ่ม (คอนเทนเนอร์หยุด + อิมเมจไม่ใช้ + build cache)</div>
        <div class="big">${fmtBytes(rec)} <small class="muted" style="font-size:15px;font-weight:600">· ${safeCount} รายการ</small></div>
        ${state.lastReclaim ? `<div style="margin-top:6px;color:var(--ok);font-weight:700">ล้างล่าสุดคืนพื้นที่ ${esc(state.lastReclaim)}</div>` : ""}</div>
      <button class="btn danger" type="button" data-clean="system" ${safeCount ? "" : "disabled"}>${icon("trash")}ล้างทั้งหมด (ไม่รวมวอลุ่ม)</button>
    </div>
    <div class="grid g2" style="margin-top:16px">
      ${CLEAN.map((c) => { const items = data[c.kind]; const size = sumSize(items);
        return `<div class="card cleancard ${c.level === "risky" ? "risky" : ""}">
          <div class="top"><div><h3>${c.title} ${c.level === "safe" ? '<span class="tag">ปลอดภัย</span>' : c.level === "mid" ? '<span class="tag warn">ต้องดึงใหม่</span>' : '<span class="tag" style="background:var(--bad-soft);color:var(--bad)">ข้อมูลหาย</span>'}</h3><div class="muted">${items.length} รายการ</div></div><div class="est">${fmtBytes(size)}</div></div>
          <p>${c.desc}</p>
          <div><button class="btn ${c.level === "risky" ? "ghost-danger" : ""}" type="button" data-clean="${c.kind}" ${items.length ? "" : "disabled"}>${icon("trash")}ดูรายการและล้าง</button></div>
        </div>`; }).join("")}
    </div>
    <div class="notice" style="margin-top:16px">${icon("warn")}<div>
      <b>พื้นที่บน Windows อาจไม่ลดทันที</b> — ไฟล์ดิสก์ของ WSL (ext4.vhdx) ไม่หดเองหลังลบไฟล์ หากอยากคืนพื้นที่ให้ไดรฟ์ C: จริง ให้ปิด WSL แล้วบีบไฟล์ใน PowerShell (Admin):
      <pre class="cmdblock">wsl --shutdown
Optimize-VHD -Path "&lt;path to ext4.vhdx&gt;" -Mode Full</pre>
      <span class="muted">ถ้าไม่มีคำสั่ง Optimize-VHD (ต้องเปิด Hyper-V) ใช้ <span class="cmd">diskpart</span> → <span class="cmd">select vdisk file="…ext4.vhdx"</span> → <span class="cmd">compact vdisk</span> แทนได้</span>
    </div></div>`;
}

function confirmClean(kind) {
  const items = (state.cleanup || {})[kind] || [], meta = CLEAN.find((c) => c.kind === kind) || { title: "ล้างทั้งหมด (ไม่รวมวอลุ่ม)", level: "mid" };
  const risky = meta.level === "risky", shown = items.slice(0, 200);
  openDialog({
    title: meta.title, danger: true, confirmText: `ลบ ${items.length} รายการ`, needType: kind === "volumes-all" || kind === "volumes" ? "DELETE" : "",
    body: `<div>จะคืนพื้นที่ประมาณ <b>${fmtBytes(sumSize(items))}</b> · ${items.length} รายการ ${risky ? '<div style="color:var(--bad);font-weight:700;margin-top:6px">ข้อมูลในวอลุ่มจะหายถาวร กู้คืนไม่ได้</div>' : ""}</div>
      <div class="list">${shown.map((i) => `<div class="li"><span><span class="tag">${KIND_TH[i.type] || i.type}</span> <b>${esc(i.name.length > 40 ? i.name.slice(0, 18) + "…" + i.name.slice(-8) : i.name)}</b> <span class="muted">${esc(i.detail)}</span></span><span class="mono">${esc(i.size || "")}</span></div>`).join("")}${items.length > shown.length ? `<div class="li muted">…และอีก ${items.length - shown.length} รายการ</div>` : ""}</div>`,
    onConfirm: async () => {
      const r = await api("/api/prune", { method: "POST", body: { kind } });
      state.lastReclaim = r.reclaimed; toast(`ล้างเสร็จ — คืนพื้นที่ ${r.reclaimed}`, "ok");
      await refresh();
    },
  });
}

/* ---------- actions ---------- */
view.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.do === "refresh") return refresh();
  if (d.tabGo) return go(d.tabGo);
  if (d.clean) return confirmClean(d.clean);
  if (d.logs) return showLogs(d.logs, d.name);
  if (d.act) return containerAction(d.act, d.id, d.name);
  if (d.imgrm) return removeImage(d.imgrm);
  if (d.volrm) return removeVolume(d.volrm);
  if (d.do === "run") return runDialog();
  if (d.do === "pull") return pullDialog();
});
view.addEventListener("input", (e) => {
  if (e.target.id === "search") { state.search = e.target.value; refresh(); }
});
view.addEventListener("change", (e) => {
  if (e.target.id === "showAll") { state.all = e.target.checked; refresh(); }
});

async function containerAction(act, id, name) {
  const go = async () => { await api(`/api/containers/${encodeURIComponent(id)}/${act}`, { method: "POST" }); refresh(); };
  if (act === "rm") {
    return openDialog({ title: "ลบคอนเทนเนอร์", danger: true, confirmText: "ลบ", body: `ลบ <b>${esc(name)}</b> แบบบังคับ? (หยุดก่อนถ้ากำลังรัน)`, onConfirm: go });
  }
  try { await go(); } catch (err) { toast(`${act} ล้มเหลว: ${err.message}`, "bad"); }
}
function removeImage(ref) {
  openDialog({ title: "ลบอิมเมจ", danger: true, confirmText: "ลบ", body: `ลบอิมเมจ <b>${esc(ref)}</b>?`,
    onConfirm: async () => { await api("/api/images/rm", { method: "POST", body: { ref } }); toast("ลบอิมเมจแล้ว", "ok"); refresh(); } });
}
function removeVolume(name) {
  openDialog({ title: "ลบวอลุ่ม", danger: true, confirmText: "ลบถาวร", needType: "DELETE",
    body: `ลบวอลุ่ม <b class="mono" style="word-break:break-all">${esc(name)}</b>?<div style="color:var(--bad);font-weight:700;margin-top:6px">ข้อมูลในวอลุ่มจะหายถาวร</div>`,
    onConfirm: async () => { await api("/api/volumes/rm", { method: "POST", body: { name } }); toast("ลบวอลุ่มแล้ว", "ok"); refresh(); } });
}
function pullDialog() {
  openDialog({ title: "ดึงอิมเมจ", confirmText: "ดึง",
    body: `<div class="field"><label>ชื่ออิมเมจ</label><input type="text" id="pullImage" placeholder="เช่น nginx:latest" autocomplete="off"><span class="hint">อาจใช้เวลาสักครู่ตามขนาดอิมเมจ</span></div>`,
    onConfirm: async (f) => { const image = $("#pullImage", f).value.trim(); if (!image) throw new Error("กรอกชื่ออิมเมจ");
      await api("/api/images/pull", { method: "POST", body: { image } }); toast(`ดึง ${image} แล้ว`, "ok"); refresh(); } });
}
function runDialog() {
  openDialog({ title: "รันคอนเทนเนอร์", confirmText: "รัน",
    body: `<div class="field"><label>อิมเมจ</label><input type="text" id="runImage" placeholder="เช่น nginx:latest" autocomplete="off"></div>
      <div class="field"><label>ชื่อ (ไม่บังคับ)</label><input type="text" id="runName" autocomplete="off"></div>
      <div class="field"><label>พอร์ต (ไม่บังคับ)</label><input type="text" id="runPorts" placeholder="8081:80, 8443:443" autocomplete="off"><span class="hint">รูปแบบ host:container คั่นด้วยจุลภาค</span></div>`,
    onConfirm: async (f) => {
      const image = $("#runImage", f).value.trim(); if (!image) throw new Error("กรอกชื่ออิมเมจ");
      const ports = $("#runPorts", f).value.split(",").map((s) => s.trim()).filter(Boolean);
      await api("/api/containers/run", { method: "POST", body: { image, name: $("#runName", f).value.trim(), ports } });
      toast("เริ่มคอนเทนเนอร์แล้ว", "ok"); refresh(); } });
}

/* logs */
let logId = null;
async function showLogs(id, name) { logId = id; $("#logTitle").textContent = `Logs · ${name}`; $("#logDlg").showModal(); await reloadLogs(); }
async function reloadLogs() {
  if (!logId) return;
  try {
    const d = await api(`/api/containers/${encodeURIComponent(logId)}/logs?tail=${$("#logTail").value}`);
    const pre = $("#logBody"); pre.textContent = d.logs || "(ไม่มีข้อความ)"; pre.scrollTop = pre.scrollHeight;
  } catch (e) { $("#logBody").textContent = e.message; }
}
$("#logReload").onclick = reloadLogs; $("#logTail").onchange = reloadLogs; $("#logClose").onclick = () => $("#logDlg").close();

/* theme */
const THEMES = ["auto", "light", "dark"], THEME_TH = { auto:"อัตโนมัติ", light:"สว่าง", dark:"มืด" };
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("#theme").textContent = "ธีม: " + THEME_TH[t];
}
let theme = "auto"; try { theme = localStorage.getItem("theme") || "auto"; } catch (_) {}
applyTheme(theme);
$("#theme").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); try { localStorage.setItem("theme", theme); } catch (_) {} };

/* boot */
const initial = location.hash.slice(1); if (TABS.some(([id]) => id === initial)) state.tab = initial;
renderNav(); mount(); refresh();
setInterval(() => { if (!document.hidden && !$("dialog[open]") && (state.tab === "overview" || state.tab === "containers")) refresh(); }, 5000);
</script>
</body>
</html>
