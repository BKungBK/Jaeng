<html lang="th">

<title>แจ้งแสง · ต้นแบบแผนที่ไทย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 'IBM Plex Sans Thai',system-ui,sans-serif;overflow:hidden}
h1,h2,.btn{font-family:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif}
h1{font-size:19px;margin:0;line-height:1.3}h2{font-size:19px;margin:10px 0 4px;line-height:1.35}
small,.sub{color:var(--ink2);font-size:13px}
.top{position:fixed;z-index:5;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.card{background:var(--surf);border-radius:18px;box-shadow:var(--sh)}

.chip[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.chip:focus-visible,.btn:focus-visible,.disc:focus-visible,.cl:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.btn{min-height:44px;min-width:44px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:0 14px;font-weight:500;font-size:15px;cursor:pointer}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:transparent}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--sea)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.land{fill:var(--land)}.blk{fill:var(--block)}.rd{stroke:var(--road);fill:none}.rv{stroke:var(--water);fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.tx{font:600 26px 'Prompt',sans-serif;fill:#2B2A33;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;text-anchor:middle}
.em{font-size:44px;text-anchor:middle}
.cloud{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(50px)}}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin,.cl{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.ring{position:absolute;left:-36px;top:-36px;width:72px;height:72px;box-sizing:border-box;border-radius:50%;border:3px solid var(--c);animation:pulse var(--d) ease-out infinite}
.ring.two{animation-delay:calc(var(--d) / 2)}

.base{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #fff}
.stand{position:absolute;left:-30px;bottom:0;width:60px;height:var(--h)}
.beam{position:absolute;inset:0;background:linear-gradient(to top,var(--c),transparent 95%);opacity:.8;clip-path:polygon(0 0,100% 0,54% 100%,46% 100%)}
.disc,.cl b{position:absolute;box-sizing:border-box;border-radius:50%;background:var(--surf);border:3px solid var(--c);display:grid;place-items:center;cursor:pointer;pointer-events:auto;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent),0 0 28px var(--c)}
.disc{left:3px;top:-30px;width:54px;height:54px;font-size:24px;line-height:1}
.cl b{left:-26px;top:-26px;width:52px;height:52px;font:600 18px 'Prompt',sans-serif;color:var(--ink)}
.sym{position:absolute;right:-8px;bottom:-4px;font-size:12px;font-style:normal;font-weight:600;background:var(--c);color:#2B2A33;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center}
.lbl{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;background:var(--surf);color:var(--ink);padding:0 8px;border-radius:10px;font:400 12px/20px 'IBM Plex Sans Thai',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.15)}

.st-done .beam,.st-done .ring{display:none}.st-done .disc{--c:var(--s0);opacity:.8}.st-done .base{--c:var(--s0)}
.zoom{position:fixed;z-index:5;right:12px;top:50%;transform:translateY(-50%);display:grid;gap:8px}
.tip{position:fixed;z-index:6;pointer-events:none;background:var(--surf);border-radius:16px;box-shadow:var(--sh);padding:8px 12px;max-width:230px;font-size:14px;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.sheet{position:fixed;z-index:7;background:var(--surf);box-shadow:var(--sh);left:0;right:0;bottom:0;max-height:64vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.sheet.on{transform:none}
@media (min-width:820px){.sheet{left:auto;right:16px;top:96px;bottom:16px;width:380px;max-height:none;border-radius:24px;transform:translateX(120%)}}
.photo{height:140px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 50%,var(--surf)),var(--land));display:grid;place-items:center;font-size:56px;position:relative}
.photo small{position:absolute;left:10px;bottom:8px;background:var(--surf);border-radius:10px;padding:0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tag{display:inline-block;border-radius:12px;padding:0 10px;font-size:13px;background:color-mix(in srgb,var(--c) 55%,var(--surf))}.tag.n{background:var(--land)}
.cm{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.close{position:absolute;right:10px;top:10px;width:44px;padding:0}
.hint{position:fixed;z-index:4;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px 14px;max-width:320px}
.toast{position:fixed;z-index:9;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:819px){.hint{bottom:auto;top:calc(78px + env(safe-area-inset-top,0px));left:12px;max-width:none}.zoom{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none}}
@media (prefers-reduced-motion:reduce){.ring,.cloud{animation:none}.ring{opacity:.5}}
</style>
</head>

if(m==='pins'){pl.innerHTML=rs.map(pinH).join('');[...pl.children].forEach((el,i)=>items.push({el,X:rs[i].X,Y:rs[i].Y}))}
else{const g={};rs.forEach(r=>{const k=Math.round(r.X/150)+','+Math.round(r.Y/150);(g[k]=g[k]||[]).push(r)});const cs=Object.values(g).map(a=>({a,X:a.reduce((t,r)=>t+r.X,0)/a.length,Y:a.reduce((t,r)=>t+r.Y,0)/a.length,lv:Math.max(...a.map(r=>r.lv))}));
pl.innerHTML=cs.map((c,i)=>`<div class="cl" style="--c:var(${LV[c.lv].c});--d:${LV[c.lv].d}"><i class="ring"></i><b tabindex="0" role="button" data-c="${i}" aria-label="${c.a.length} เรื่องในพื้นที่นี้">${c.a.length}</b></div>`).join('');
[...pl.children].forEach((el,i)=>{el.cs=cs[i];items.push({el,X:cs[i].X,Y:cs[i].Y})})}}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function frame(){mx=cl(mx,0,W);my=cl(my,0,H);s=cl(s,fit*.95,16);const vw=sw/s,vh=sh/s;
svg.setAttribute('viewBox',`${mx-vw/2} ${my-vh/2} ${vw} ${vh}`);
const a=cl((4-s)/2.8,0,1);$('gi').style.opacity=a;$('gf').style.opacity=1;stage.style.background=`color-mix(in srgb,var(--sea) ${a*100}%,var(--water))`;
const m=s<2.2?'clusters':'pins';if(m!==mode){mode=m;build(m)}
items.forEach(i=>{i.el.style.transform=`translate(${(i.X-mx)*s+sw/2}px,${(i.Y-my)*s+sh/2}px)`});
$('lod').textContent=s<2.2?'ภาพรวมประเทศ: วงตัวเลข = จำนวนเรื่องในพื้นที่ ซูมเข้าเพื่อดูแต่ละเรื่อง':s<4?'ซูมต่อไป ภาพประกอบจะค่อยๆ กลายเป็นแผนที่ปกติ':'ระดับย่าน: แผนที่ปกติ เห็นถนนและบล็อก'}
function zoomAt(px,py,f){const X=mx+(px-sw/2)/s;const Y=my+(py-sh/2)/s;s=cl(s*f,fit*.95,16);mx=X-(px-sw/2)/s;my=Y-(py-sh/2)/s;frame()}
function fly(x,y,s2,ms=800){const a=[mx,my,s],t0=performance.now();(function st(t){const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;mx=a[0]+(x-a[0])*e;my=a[1]+(y-a[1])*e;s=a[2]*Math.pow(s2/a[2],e);frame();if(k<1)requestAnimationFrame(st)})(t0)}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});
stage.addEventListener('dblclick',e=>zoomAt(e.clientX,e.clientY,2));
$('zin').onclick=()=>zoomAt(sw/2,sh/2,1.7);$('zout').onclick=()=>zoomAt(sw/2,sh/2,1/1.7);
$('me2').onclick=()=>{const[x,y]=P(100.55,13.75);fly(x,y,5.5,1400)};
const ptr=new Map();let moved=0,lastD=0;
stage.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;lastD=0});
addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
if(ptr.size===1){const dx=e.clientX-o[0],dy=e.clientY-o[1];moved+=Math.abs(dx)+Math.abs(dy);mx-=dx/s;my-=dy/s;frame()}
else if(ptr.size===2){const[p,q]=[...ptr.values()],dist=Math.hypot(p[0]-q[0],p[1]-q[1]);moved+=9;if(lastD)zoomAt((p[0]+q[0])/2,(p[1]+q[1])/2,dist/lastD);lastD=dist}});
addEventListener('pointerup',e=>{ptr.delete(e.pointerId);lastD=0});addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);lastD=0});
$('pl').addEventListener('pointerover',e=>{const d=e.target.closest('.disc');if(!d||e.pointerType!=='mouse')return;const r=R.find(x=>x.id==d.dataset.id),b=d.getBoundingClientRect(),l=LV[r.lv];tip.innerHTML=`<b>${r.t}</b><br><small>${l.s} ${l.n} · ${ST[r.st]} · เจอเหมือนกัน ${r.n}</small>`;tip.style.left=Math.min(innerWidth-250,b.right+10)+'px';tip.style.top=Math.max(70,b.top)+'px';tip.classList.add('on')});
$('pl').addEventListener('pointerout',()=>tip.classList.remove('on'));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function open(id){const r=R.find(x=>x.id==id),l=LV[r.lv],n=r.n+(mine.has(id)?1:0);tip.classList.remove('on');
$('sheet').style.setProperty('--c',`var(${l.c})`);
$('sheet').innerHTML=`<button class="btn close" id="x" aria-label="ปิด">✕</button><div class="photo">${r.ic}<small>🛡 เบลอใบหน้าและป้ายทะเบียนแล้ว</small></div><h2>${r.t}</h2>
<div class="row"><span class="tag">${l.s} ${l.n}</span><span class="tag n">${r.ic} ${r.cat}</span><span class="tag n">${ST[r.st]}</span>${r.st==='open'?`<span class="tag n">ค้างมา ${r.d} วัน</span>`:''}</div>
<p style="margin:4px 0">${r.x0}</p>${r.lv===3?'<p class="tag" style="padding:4px 10px;white-space:normal">ระบบนี้ไม่ใช่ช่องทางฉุกเฉิน หากมีอันตรายทันที โทร 191 / 199 / 1669</p>':''}
<div class="row"><button class="btn pri" id="me" aria-pressed="${mine.has(id)}">เจอเหมือนกัน · ${n}</button>${r.st==='open'?'<button class="btn" id="fix">แจ้งว่าแก้แล้ว</button>':''}${r.st==='claimed'?'<button class="btn" id="adm">(เดโมผู้ดูแล) ยืนยันว่าแก้แล้ว</button>':''}</div>
<small>ความคิดเห็น</small>${CM.map(c=>`<div class="cm">${c}</div>`).join('')}`;
$('sheet').classList.add('on');
$('x').onclick=()=>$('sheet').classList.remove('on');
$('me').onclick=()=>{mine.has(id)?mine.delete(id):mine.add(id);open(id)};
if($('fix'))$('fix').onclick=()=>{r.st='claimed';toast('ขอบคุณ ส่งให้ผู้ดูแลตรวจสอบแล้ว');mode='';frame();open(id)};
if($('adm'))$('adm').onclick=()=>{r.st='done';toast('ยืนยันแล้ว ลำแสงดับลง');mode='';frame();open(id)}}
function act(t){const d=t.closest('.disc'),c=t.closest('[data-c]');if(d&&moved<8)open(d.dataset.id);else if(c&&moved<8){const k=items.find(i=>i.el.contains(c)).el.cs;fly(k.X,k.Y,Math.max(s*2.6,3.2))}}
$('pl').addEventListener('pointerdown',()=>{moved=0});
$('pl').addEventListener('click',e=>act(e.target));
$('pl').addEventListener('keydown',e=>{if(e.key==='Enter'){moved=0;act(e.target)}});
addEventListener('resize',()=>{size();frame()});
frame();
</script>
</body>
</html>
